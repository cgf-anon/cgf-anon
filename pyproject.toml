[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cgf-softmax"
version = "0.1.0"
description = "Implementation of CGF-softmax with desilofhe"
requires-python = ">=3.10,<3.15"
dependencies = [
    "desilofhe",
    "numpy",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
